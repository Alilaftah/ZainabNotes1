name: Build Android APK Final

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean & Install Node Dependencies
      run: |
        npm ci --legacy-peer-deps || npm install --legacy-peer-deps

    - name: Build Web Application
      run: |
        npm run build || true
        mkdir -p dist
        if [ ! -f "dist/index.html" ]; then
          cp index.html dist/ 2>/dev/null || true
          cp -r src dist/ 2>/dev/null || true
          cp -r public/* dist/ 2>/dev/null || true
        fi

    - name: Setup & Sync Capacitor Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
        rm -rf android
        npx cap init ZainabNotes com.zainab.notes --web-dir dist
        npx cap add android
        npx cap sync android

    - name: Configure Gradle & Android Environment
      run: |
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
        chmod +x android/gradlew

    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZainabNotes-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
