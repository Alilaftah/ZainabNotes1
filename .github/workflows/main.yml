name: Build Android APK Final

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Node Dependencies
      run: npm install --legacy-peer-deps

    - name: Prepare Web Build Folder
      run: |
        npm run build || true
        mkdir -p dist
        if [ ! -f "dist/index.html" ]; then
          cp index.html dist/ 2>/dev/null || true
          cp -r src dist/ 2>/dev/null || true
          cp -r public/* dist/ 2>/dev/null || true
        fi

    - name: Setup Capacitor Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
        rm -rf android
        npx cap init ZainabNotes com.zainab.notes --web-dir dist
        npx cap add android
        npx cap sync android

    - name: Fix Gradle Permissions & Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ZainabNotes-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
