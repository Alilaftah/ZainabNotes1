name: Build Android APK via Capacitor

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Web Directory & Setup Capacitor
      run: |
        mkdir -p www
        cp index.html www/ 2>/dev/null || true
        cp -r src www/ 2>/dev/null || true
        cp -r public/* www/ 2>/dev/null || true
        
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init ZainabNotes com.zainab.notes --web-dir www
        npx cap add android
        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZainabNotes-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
