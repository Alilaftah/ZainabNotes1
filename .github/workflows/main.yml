name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Build Web Project
      run: npm run build --if-present

    - name: Create Web Output Directory if Missing
      run: |
        if [ ! -d "dist" ] && [ ! -d "build" ]; then
          mkdir dist
          cp index.html dist/ 2>/dev/null || true
          cp -r src dist/ 2>/dev/null || true
        fi

    - name: Setup Capacitor and Android Platform
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init ZainabNotes com.zainab.notes --web-dir $(if [ -d "dist" ]; then echo "dist"; else echo "build"; fi)
        npx cap add android
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ZainabNotes-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
